  <style>

    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>

<body>
  <div id="__bundler_placeholder">Loading سیبل — صفحهٔ اصلی...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 justify-content: space-between; gap: 12px 24px; padding: 14px clamp(16px, 2.2vw, 32px)\">\n<nav aria-label=\"دسته‌بندی‌ها\" style=\"display: flex; flex-wrap: wrap; gap: 4px 28px; flex: 1 1 300px; font-size: 13px; font-weight: 500\">\n<a class=\"ln\" href=\"#outerwear\" style=\"display: inline-flex; align-items: center; min-height: 44px\">پوشاک بیرونی<\u002Fa>\n<a class=\"ln\" href=\"#knitwear\" style=\"display: inline-flex; align-items: center; min-height: 44px\">بافت‌ها<\u002Fa>\n<a class=\"ln\" href=\"#tailoring\" style=\"display: inline-flex; align-items: center; min-height: 44px\">کت‌وشلوار<\u002Fa>\n<a class=\"ln\" href=\"#archive\" style=\"display: inline-flex; align-items: center; min-height: 44px\">آرشیو<\u002Fa>\n<\u002Fnav>\n<a href=\"#top\" aria-label=\"سیبل — صفحهٔ اصلی\" style=\"font-size: 26px; font-weight: 900; line-height: 1; letter-spacing: 0\">سیبل<\u002Fa>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 28px; flex: 1 1 300px; font-size: 13px; font-weight: 500\">\n<a class=\"ln\" href=\"#search\" style=\"display: inline-flex; align-items: center; min-height: 44px; color: #5E5B55\">جستجو<\u002Fa>\n<a class=\"ln\" href=\"#account\" style=\"display: inline-flex; align-items: center; min-height: 44px; color: #5E5B55\">حساب کاربری<\u002Fa>\n<a class=\"ln\" href=\"#bag\" style=\"display: inline-flex; align-items: center; min-height: 44px\">سبد خرید (۰)<\u002Fa>\n<\u002Fdiv>\n<\u002Fheader>\n\n<!-- هیرو -->\n<section id=\"top\" style=\"position: relative; min-height: 800px; display: flex; flex-direction: column; justify-content: space-between; padding: 28px clamp(16px, 2.2vw, 32px) 40px; overflow: hidden\">\n<div style=\"position: relative; z-index: 3; font-size: 13px; font-weight: 500; line-height: 2; max-width: 160px\">\nمدی که<br>با تو<br>حرکت می‌کند\n<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-bottom: 60px; z-index: 1\">\n<span style=\"font-size: clamp(150px, 31vw, 450px); font-weight: 900; line-height: 1; letter-spacing: 0; color: #121212\">سیبل<\u002Fspan>\n<\u002Fdiv>\n<div style=\"position: absolute; z-index: 2; bottom: 0; inset-inline-start: 50%; transform: translateX(50%); width: clamp(170px, 21vw, 300px); height: 72%; min-height: 380px; box-sizing: border-box; border: 1px dashed #8C8880; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; font-size: 12px; line-height: 1.7; color: #5E5B55\">\n[تصویر مدل<br>— PNG بدون پس‌زمینه]\n<\u002Fdiv>\n<div style=\"position: relative; z-index: 3; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px\">\n<a class=\"btn\" href=\"#new\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 32px; background: #121212; color: #ECEAE5; font-size: 13px; font-weight: 700\">خرید کالکشن<\u002Fa>\n<a class=\"ln ul\" href=\"#best\" style=\"display: inline-flex; align-items: center; min-height: 44px; font-size: 13px; font-weight: 500\">تازه‌ها را ببینید<\u002Fa>\n<\u002Fdiv>\n<div style=\"font-size: 12px; line-height: 2; color: #5E5B55\">\nکالکشن پاییز<br>۱۴۰۵\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- دسته‌بندی‌ها -->\n<section class=\"dark\" aria-label=\"دسته‌بندی‌ها\" style=\"background: #141414; color: #ECEAE5; padding: 40px clamp(16px, 2.2vw, 32px)\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 32px\">\n<a id=\"outerwear\" class=\"ln\" href=\"#outerwear\" style=\"display: flex; align-items: center; gap: 20px\">\n<img src=\"09256783-fa09-4505-bef9-0e6672eab6e2\" alt=\"مدل با اورشرت مشکی\" style=\"width: 60px; height: 84px; object-fit: cover; flex: none\">\n<span style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 17px; font-weight: 900; line-height: 1.5\">پوشاک بیرونی<\u002Fspan>\n<span style=\"font-size: 12px; line-height: 1.8; color: #A8A59E\">کت، پالتو و اورشرت با فضای کافی برای حرکت.<\u002Fspan>\n<span style=\"font-size: 12px; font-weight: 700\">خرید پوشاک بیرونی ←<\u002Fspan>\n<\u002Fspan>\n<\u002Fa>\n<a id=\"knitwear\" class=\"ln\" href=\"#knitwear\" style=\"display: flex; align-items: center; gap: 20px\">\n<img src=\"f2a21e06-c9d0-4705-9a28-378c6441214a\" alt=\"مدل با پلیور بافت کرم\" style=\"width: 60px; height: 84px; object-fit: cover; flex: none\">\n<span style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 17px; font-weight: 900; line-height: 1.5\">بافت‌ها<\u002Fspan>\n<span style=\"font-size: 12px; line-height: 1.8; color: #A8A59E\">پشم بره با بافت ضخیم؛ از فصل دوم نرم و دست‌آموز.<\u002Fspan>\n<span style=\"font-size: 12px; font-weight: 700\">خرید بافت‌ها ←<\u002Fspan>\n<\u002Fspan>\n<\u002Fa>\n<a id=\"tailoring\" class=\"ln\" href=\"#tailoring\" style=\"display: flex; align-items: center; gap: 20px\">\n<img src=\"12b7ef17-2119-46f3-970a-a3d290914eea\" alt=\"مدل با کت خاکستری\" style=\"width: 60px; height: 84px; object-fit: cover; flex: none\">\n<span style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 17px; font-weight: 900; line-height: 1.5\">کت‌وشلوار<\u002Fspan>\n<span style=\"font-size: 12px; line-height: 1.8; color: #A8A59E\">کت‌های بی‌آستر سخت و شلوارهای چین‌دار که واقعاً راحت می‌نشینند.<\u002Fspan>\n<span style=\"font-size: 12px; font-weight: 700\">خرید کت‌وشلوار ←<\u002Fspan>\n<\u002Fspan>\n<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- فصل جدید -->\n<section id=\"new\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(480px, 100%), 1fr))\">\n<div style=\"background: #D8D4CC; padding: clamp(32px, 6vw, 80px) clamp(24px, 4.4vw, 64px); display: flex; flex-direction: column; justify-content: center; gap: 20px; min-height: 420px\">\n<span style=\"font-size: 12px; color: #5E5B55\">فصل جدید<\u002Fspan>\n<h2 style=\"margin: 0; font-size: clamp(56px, 8vw, 104px); font-weight: 900; line-height: 1.15; letter-spacing: 0\">حال‌وهوای<br>تازه<\u002Fh2>\n<p style=\"margin: 0; max-width: 360px; font-size: 14px; line-height: 2; color: #3A3834; text-wrap: pretty\">شانزده تکه، یک پالت رنگی، برش‌خورده از همان سه پارچه. هر چیز در این دراپ با بقیه می‌خواند، و همین کل ماجراست.<\u002Fp>\n<div>\n<a class=\"btn\" href=\"#best\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 32px; background: #121212; color: #ECEAE5; font-size: 13px; font-weight: 700\">مشاهدهٔ کالکشن<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"min-height: 560px; background: #8E8E8E\">\n<img src=\"ef4b5cf6-0e2d-4864-a72f-00e671db34fe\" alt=\"پرتره مدل با اورشرت یقه‌باز مشکی\" style=\"width: 100%; height: 100%; min-height: 560px; object-fit: cover; object-position: 70% 20%; display: block\">\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- مزایا -->\n<section aria-label=\"وعده‌های ما\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 28px 32px; padding: 44px clamp(16px, 2.2vw, 32px)\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 13px; font-weight: 900\">ارسال سریع<\u002Fspan>\n<span style=\"font-size: 12px; color: #5E5B55; line-height: 1.9\">ظرف ۲۴ ساعت ارسال می‌شود، همراه با کد رهگیری.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 13px; font-weight: 900\">بازگشت آسان<\u002Fspan>\n<span style=\"font-size: 12px; color: #5E5B55; line-height: 1.9\">۳۰ روز فرصت دارید؛ برچسب بازگشت داخل بسته است.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 13px; font-weight: 900\">ساخته‌شده برای ماندن<\u002Fspan>\n<span style=\"font-size: 12px; color: #5E5B55; line-height: 1.9\">تعمیر رایگان در دو سال اول.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; ; margin-top: 12px; font-size: 13px; font-weight: 700\"><span>ژاکت بافت گیج<\u002Fspan><span>۲۱۰ پوند<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 12px; color: #5E5B55\">بافت‌ها<\u002Fdiv>\n<\u002Farticle>\n<article>\n<div style=\"position: relative; background: #E4DFD7\">\n<img src=\"64c22928-b22c-46ce-8a63-0e7fed75ff2f\" alt=\"پلیور بافت طنابی کرم\" style=\"display: block; width: 100%; aspect-ratio: 9 / 10; object-fit: cover\">\n<button class=\"btn\" type=\"button\" aria-label=\"افزودن پلیور بافت طنابی به علاقه‌مندی‌ها\" style=\"position: absolute; top: 8px; inset-inline-end: 8px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(236,234,229,.8); display: flex; align-items: center; justify-content: center; padding: 0\">\n<svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#121212\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: 13px; font-weight: 700\"><span>پلیور بافت طنابی<\u002Fspan><span>۲۴۰ پوند<\u002Fspan><\u002Fdiv>\n<div style=\"font-size: 12px; color: #5E5B55\">بافت‌ها<\u002Fdiv>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- لوک‌بوک -->\n<section id=\"lookbook\" style=\"padding: 24px clamp(16px, 2.2vw, 32px) 96px\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 24px 32px; margin-bottom: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-size: 12px; color: #5E5B55\">لوک‌بوک<\u002Fspan>\n<h2 style=\"margin: 0; font-size: clamp(48px, 6.4vw, 92px); font-weight: 900; line-height: 1.25; letter-spacing: 0\">پاییز ۱۴۰۵<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 0; padding-top: 28px; max-width: 340px; font-size: 13px; line-height: 2; color: #3A3834; text-wrap: pretty\">طی دو صبح در جزیرهٔ گرین عکاسی شد. هیچ چیز اتو یا روتوش نشد؛ برای همین کت‌ها شبیه کت‌اند.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px\">\n<figure style=\"margin: 0; flex: 5 1 320px\">\n<div style=\"background: #E0DCD4; padding-top: 56px\">\n<img src=\"eecdd0da-50ae-4546-a8de-2871a92b1b3c\" alt=\"اورکت خاکستری و شلوار گشاد، جلوی دیوار بتنی\" style=\"display: block; width: 100%; aspect-ratio: 1 / 1.02; object-fit: cover\">\n<\u002Fdiv>\n<figcaption style=\"margin-top: 12px; font-size: 12px; color: #5E5B55\"><b style=\"color: #121212\">۰۱<\u002Fb> &nbsp; اورکت، شلوار گشاد<\u002Ffigcaption>\n<\u002Ffigure>\n<figure style=\"margin: 64px 0 0; flex: 7 1 420px\">\n<img src=\"52ea667c-f91f-49c6-bfc5-71e2417e1368\" alt=\"دو نفر روی نیمکت بتنی؛ یکی با پلیور طنابی کرم و دیگری با اورشرت مشکی\" style=\"display: block; width: 100%; aspect-ratio: 946 / 618; object-fit: cover\">\n<figcaption style=\"margin-top: 12px; font-size: 12px; color: #5E5B55\"><b style=\"color: #121212\">۰۲<\u002Fb> &nbsp; پلیور طنابی، اورشرت<\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n<div style=\"display: flex; margin-top: 48px\">\n<figure style=\"margin: 0; width: min(100%, 40%); min-width: 280px; margin-inline-start: 17%\">\n<div style=\"background: #E0DCD4; padding-top: 64px\">\n<img src=\"00361092-6fbd-4f86-b172-58570566b246\" alt=\"مدل با یقه باز، پرتره نزدیک\" style=\"display: block; width: 100%; aspect-ratio: 668 / 539; object-fit: cover\">\n<\u002Fdiv>\n<figcaption style=\"margin-top: 12px; font-size: 12px; color: #5E5B55\"><b style=\"color: #121212\">۰۳<\u002Fb> &nbsp; یقه باز، باز پوشیده‌شده<\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- سه پارچه -->\n<section id=\"cloth\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(480px, 100%), 1fr))\">\n<div style=\"background: #D8D4CC; padding: clamp(32px, 5vw, 72px) clamp(24px, 4.4vw, 64px); display: flex; flex-direction: column; justify-content: center; gap: 20px\">\n<span style=\"font-size: 12px; color: #5E5B55\">پارچه<\u002Fspan>\n<h2 style=\"margin: 0; font-size: clamp(40px, 5vw, 68px); font-weight: 900; line-height: 1.3; letter-spacing: 0\">سه پارچه،<br>تمام فصل.<\u002Fh2>\n<p style=\"margin: 0; max-width: 420px; font-size: 14px; line-height: 2; color: #3A3834; text-wrap: pretty\">هر سال یک پشم، یک پنبه و یک پشم بره را از یک آسیاب و به مقدار محدود می‌خریم. به همین دلیل کتی که دو فصل پیش خریده‌اید هنوز با تازه‌ها می‌خواند.<\u002Fp>\n<div style=\"max-width: 460px; font-size: 13px\">\n<div style=\"display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid rgba(18,18,18,.25)\"><span style=\"font-weight: 700\">پشم ملتون<\u002Fspan><span style=\"color: #5E5B55\">۶۲۰ گرم · هادرزفیلد<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid rgba(18,18,18,.25)\"><span style=\"font-weight: 700\">پنبهٔ خشک<\u002Fspan><span style=\"color: #5E5B55\">۳۴۰ گرم · اوزاکا<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid rgba(18,18,18,.25); border-bottom: 1px solid rgba(18,18,18,.25)\"><span style=\"font-weight: 700\">پشم بره<\u002Fspan><span style=\"color: #5E5B55\">گیج ۷ · هاویک<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"min-height: 480px; background: #333\">\n<img src=\"898f33f9-331b-42e9-b6ac-2b3030f8e769\" alt=\"نمای نزدیک از بافت پشم خاکستری\" style=\"display: block; width: 100%; height: 100%; min-height: 480px; object-fit: cover\">\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- استودیو -->\n<section id=\"studio\" class=\"dark\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(480px, 100%), 1fr))\">\n<div style=\"background: #141414; color: #ECEAE5; padding: clamp(32px, 5vw, 72px) clamp(24px, 4.4vw, 64px); display: flex; flex-direction: column; justify-content: center; gap: 24px\">\n<span style=\"font-size: 12px; color: #A8A59E\">استودیو<\u002Fspan>\n<h2 style=\"margin: 0; font-size: clamp(40px, 5vw, 68px); font-weight: 900; line-height: 1.3; letter-spacing: 0\">یازده نفر،<br>یک طبقه.<\u002Fh2>\n<p style=\"margin: 0; max-width: 420px; font-size: 14px; line-height: 2; color: #C9C6BF; text-wrap: pretty\">همه‌چیز در یک ساختمان، در خیابان ردچرچ لندن، برش و دوخت می‌شود. تولیدها کوچک است؛ پس اگر چیزی نفروشد، دوباره نمی‌سازیمش.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px 48px; margin-top: 8px\">\n<div><div style=\"font-size: 52px; font-weight: 900; line-height: 1.2\">۱۱<\u002Fdiv><div style=\"font-size: 12px; color: #A8A59E\">نفر<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size: 52px; font-weight: 900; line-height: 1.2\">۴۲<\u002Fdiv><div style=\"font-size: 12px; color: #A8A59E\">سبک در سال<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size: 52px; font-weight: 900; line-height: 1.2\">۱۲۰<\u002Fdiv><div style=\"font-size: 12px; color: #A8A59E\">عدد در هر تولید<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"min-height: 480px; background: #222\">\n<img src=\"a7ccaa40-dcc3-47ec-93cf-a96d93210eb2\" alt=\"دست‌های خیاط پشت چرخ خیاطی صنعتی\" style=\"display: block; width: 100%; height: 100%; min-height: 480px; object-fit: cover\">\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- خبرنامه -->\n<section id=\"list\" style=\"padding: 96px clamp(16px, 2.2vw, 32px); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px\">\n<h2 style=\"margin: 0; font-size: clamp(36px, 4.6vw, 64px); font-weight: 900; line-height: 1.35; letter-spacing: 0\">اولین نگاه، اولین تولید.<\u002Fh2>\n<p style=\"margin: 0; max-width: 420px; font-size: 13px; line-height: 2; color: #5E5B55; text-wrap: pretty\">تولیدها کوچک‌اند و زود تمام می‌شوند. ماهی یک‌بار، پیش از انتشار در سایت، برایتان می‌نویسیم.<\u002Fp>\n<form action=\"#list\" style=\"display: flex; flex-wrap: wrap; justify-content: center; gap: 0; width: min(100%, 440px); margin-top: 12px\">\n<label for=\"email\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap\">ایمیل<\u002Flabel>\n<input id=\"email\" type=\"email\" placeholder=\"you@email.com\" dir=\"ltr\" style=\"flex: 1 1 220px; min-width: 0; box-sizing: border-box; height: 52px; padding: 0 16px; border: 1px solid rgba(18,18,18,.3); border-radius: 0; background: transparent; font-family: inherit; font-size: 14px; color: #121212; text-align: start\">\n<button class=\"btn\" type=\"submit\" style=\"height: 52px; padding: 0 28px; border: 0; border-radius: 0; background: #121212; color: #ECEAE5; font-family: inherit; font-size: 13px; font-weight: 700\">عضویت در فهرست<\u002Fbutton>\n<\u002Fform>\n<\u002Fsection>\n\n<!-- فوتر -->\n<footer style=\"padding: 48px clamp(16px, 2.2vw, 32px) 28px; border-top: 1px solid rgba(18,18,18,.15)\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 40px 32px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-size: 26px; font-weight: 900; line-height: 1.2\">سیبل<\u002Fspan>\n<span style=\"font-size: 12px; line-height: 2; color: #5E5B55\">خیابان ردچرچ ۱۸<br>لندن، E2 7DP<\u002Fspan>\n<a class=\"ln\" href=\"mailto:hello@sable.studio\" dir=\"ltr\" style=\"font-size: 12px; color: #5E5B55; text-align: end\">hello@sable.studio<\u002Fa>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<span style=\"font-size: 12px; font-weight: 900; margin-bottom: 8px\">خرید<\u002Fspan>\n<a class=\"ln\" href=\"#outerwear\" style=\"display: inline-flex; align-items: center; min-height: 36px; font-size: 12px; color: #5E5B55\">پوشاک بیرونی<\u002Fa>\n<a class=\"ln\" href=\"#knitwear\" style=\"display: inline-flex; align-items: center; min-height: 36px; font-size: 12px; color: #5E5B55\">بافت‌ها<\u002Fa>\n<a class=\"ln\" href=\"#tailoring\" style=\"display: inline-flex; align-items: center; min-height:
